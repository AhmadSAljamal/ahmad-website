name: Fetch Eagle Hills media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['eagle-hills-syria/media-list.txt', '.github/workflows/fetch-media.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download images (resized to 1600px JPEG)
        shell: bash
        run: |
          set +e
          command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp)
          mkdir -p eagle-hills-syria/media
          ok=0
          while read -r name url; do
            [ -z "$name" ] && continue
            if curl -fsSL -A "Mozilla/5.0" -o "/tmp/$name" "$url"; then
              out="eagle-hills-syria/media/${name%.*}.jpg"
              if convert "/tmp/$name" -resize '1600x>' -quality 82 -interlace Plane "$out"; then ok=$((ok+1)); echo "ok $out"; else echo "CONVERT FAILED $name"; fi
            else echo "DOWNLOAD FAILED $name"; fi
          done < eagle-hills-syria/media-list.txt
          ls -la eagle-hills-syria/media
          echo "converted $ok"
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eagle-hills-syria/media
          git diff --cached --quiet || git commit -m "Add Eagle Hills Syria media"
          git push
